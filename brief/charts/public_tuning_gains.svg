<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='224' viewBox='0 0 1000 224' font-family='Arial,Helvetica,sans-serif'><rect width='1000' height='224' fill='white'/><text x='14' y='22' font-size='15' font-weight='bold' fill='#1a202c'>Tuning gains: what LoRA/QLoRA added to the blind score</text><text x='14' y='54' font-size='12' font-weight='bold' fill='#2d3748'>Score change from tuning (paired, points on the 1-5 scale; 0 = no change)</text><text x='462' y='76' font-size='11' text-anchor='end' fill='#1a202c'>self-distilled model, round 1 (vs its untuned base)</text><rect x='639.2' y='65' width='6.4' height='14' fill='#dd6b20' opacity='0.9'/><text x='651.7' y='76' font-size='11' fill='#1a202c'>+0.02</text><text x='462' y='98' font-size='11' text-anchor='end' fill='#1a202c'>self-distilled model, round 2 (vs its untuned base)</text><rect x='621.6' y='87' width='17.6' height='14' fill='#dd6b20' opacity='0.9'/><text x='645.2' y='98' font-size='11' fill='#1a202c'>-0.05</text><text x='462' y='120' font-size='11' text-anchor='end' fill='#1a202c'>small model tuned on cleaned stronger-model outputs, round 1 (vs untuned, shorter prompt)</text><rect x='639.2' y='109' width='79.5' height='14' fill='#dd6b20' opacity='0.9'/><text x='724.8' y='120' font-size='11' fill='#1a202c'>+0.23</text><text x='462' y='142' font-size='11' text-anchor='end' fill='#1a202c'>same model, round 2 (cleaned data) minus round 1</text><rect x='560.4' y='131' width='78.9' height='14' fill='#dd6b20' opacity='0.9'/><text x='645.2' y='142' font-size='11' fill='#1a202c'>-0.23</text><text x='462' y='164' font-size='11' text-anchor='end' fill='#1a202c'>second small model tuned (vs its untuned single draft)</text><rect x='523.5' y='153' width='115.8' height='14' fill='#dd6b20' opacity='0.9'/><text x='645.2' y='164' font-size='11' fill='#1a202c'>-0.34</text><text x='462' y='186' font-size='11' text-anchor='end' fill='#1a202c'>untuned + fixing pass vs tuned (second small model)</text><rect x='639.2' y='175' width='208.2' height='14' fill='#38a169' opacity='0.9'/><text x='853.4' y='186' font-size='11' fill='#1a202c'>+0.61</text><line x1='639.2' x2='639.2' y1='40' y2='194' stroke='#4a5568' stroke-dasharray='5 4' stroke-width='1.5'/><text x='642.2' y='36' font-size='10' text-anchor='start' fill='#4a5568'>no change</text><text x='14' y='212' font-size='10' fill='#4a5568'>Orange = tuning; green = an untuned model with a check-and-rewrite pass, for scale. Differences under about 0.1 are inside judging noise.</text></svg>